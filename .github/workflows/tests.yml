name: Offline tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: ruff check . && ruff format --check .
      - run: python -m unittest discover -p 'test_*.py'
  parser-runtime:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock.txt uv==0.11.32
      - run: uv pip install --system --torch-backend cpu -r requirements-parser.lock.txt
      - run: python -m pip check
      - name: Real Docling conversion without model downloads or AI keys
        run: |
          DOCLING_PYTHON="$(python -c 'import sys; print(sys.executable)')" RUN_PARSER_SMOKE=1 python -m unittest test_parser_runtime
  review-ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-ui.lock.txt -r requirements-ui-dev.txt
      - run: python -m pip check
      - run: ruff check . && ruff format --check .
      - run: python -m pytest
        env:
          RAG_REVIEW_DATA: /tmp/scope-data-bot-ci
      - run: node --check review_ui/static/app.js && node --check review_ui/static/pipeline.js && node --check review_ui/static/credentials.js
